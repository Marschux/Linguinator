services:
  linguinator:
    image: registry.gitlab.com/uncoded-bytes/linguinator:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: linguinator
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "5051:5051"
    volumes:
      - hf-cache:/cache/huggingface
      - history:/data/history
    environment:
      HF_HOME: /cache/huggingface
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5051/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s


    # --- GPU: uncomment the 5 lines below (host needs the NVIDIA container runtime) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: ["gpu"]
    # --- end GPU ---

volumes:
  hf-cache:
    driver: local
  history:
    driver: local

networks:
  proxy-net:
    external: true
