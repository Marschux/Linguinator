services:
  lingumachina:
    image: registry.gitlab.com/marschu/lingumachina:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lingumachina
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "5051:5051"
    volumes:
      - hf-cache:/cache/huggingface
      - history:/data/history
    environment:
      HF_HOME: /cache/huggingface
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, ssl, urllib.request; scheme = 'https' if os.getenv('LINGUMACHINA_SSL_CERTFILE') and os.getenv('LINGUMACHINA_SSL_KEYFILE') else 'http'; context = ssl._create_unverified_context() if scheme == 'https' else None; urllib.request.urlopen(f'{scheme}://localhost:5051/health', timeout=5, context=context)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  lingumachina-gpu:
    profiles: ["gpu"]
    image: registry.gitlab.com/marschu/lingumachina:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lingumachina-gpu
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "5052:5051"
    volumes:
      - hf-cache:/cache/huggingface
      - history:/data/history
    environment:
      HF_HOME: /cache/huggingface
      LINGUMACHINA_DEVICE: cuda
    networks:
      - proxy-net
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

volumes:
  hf-cache:
    driver: local
  history:
    driver: local

networks:
  proxy-net:
    external: true
