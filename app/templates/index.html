<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linguinator</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <h1><a href="." class="brand-link" title="Reload Linguinator." data-title-key="tipReload"><img class="brand-logo" src="static/favicon.svg" alt="">Linguinator</a></h1>
        <p class="subtle">Local translation workbench for text and document workflows.</p>
      </div>
      <div class="header-right">
        <div class="header-controls">
          <label for="uiLanguage" class="visually-hidden">UI Language</label>
          <select id="uiLanguage" title="Select the interface language." data-title-key="tipUiLanguage">
              <option value="en">&#127468;&#127463; English</option>
              <option value="de">&#127465;&#127466; Deutsch</option>
              <option value="es">&#127466;&#127480; Español</option>
              <option value="fr">&#127467;&#127479; Français</option>
          </select>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" title="Toggle light/dark mode." data-title-key="tipTheme" aria-label="Toggle light/dark mode." aria-pressed="false">
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5a8.5 8.5 0 1 1-9-13 7 7 0 0 0 9 13z"></path></svg>
        </button>
      </div>
    </header>

    <section class="grid workspace-section">
      <div class="tabs-row">
        <div class="tabs" role="tablist" aria-label="Input type">
          <button class="tab" type="button" data-input-tab="textarea" title="Type text directly into the input field." data-title-key="tipTabTextarea"><span class="tab-label">Text Field</span></button>
          <button class="tab" type="button" data-input-tab="text" title="Load and translate a TXT file, and also HTML, SRT, VTT, JSON, YAML, PO or XLIFF." data-title-key="tipTabText"><span class="tab-label">TXT File</span></button>
          <button class="tab" type="button" data-input-tab="markdown" title="Load and translate a Markdown file." data-title-key="tipTabMarkdown"><span class="tab-label">Markdown</span></button>
          <button class="tab" type="button" data-input-tab="pptx" title="Load and translate a PowerPoint (PPTX) file as text." data-title-key="tipTabPptx"><span class="tab-label">PPTX File</span></button>
          <button class="tab" type="button" data-input-tab="csv" title="Load and translate selected CSV or XLSX columns." data-title-key="tipTabCsv"><span class="tab-label">CSV File</span></button>
          <button class="tab" type="button" data-input-tab="office" title="Load and translate a DOCX or ODT file as text." data-title-key="tipTabOffice"><span class="tab-label">DOC File</span></button>
          <button class="tab active" type="button" data-input-tab="pdf" title="Extract and translate a PDF page by page." data-title-key="tipTabPdf"><span class="tab-label">PDF</span></button>
        </div>
        <select id="inputTabSelect" class="input-tab-select" aria-label="Input type" title="Select the input type." data-title-key="tipInputType">
          <option value="textarea">Text Field</option>
          <option value="text">TXT File</option>
          <option value="markdown">Markdown</option>
          <option value="pptx">PPTX File</option>
          <option value="csv">CSV File</option>
          <option value="office">DOC File</option>
          <option value="pdf">PDF</option>
        </select>
      </div>

      <div id="languageRow" class="row">
        <div class="language-field" data-picker="source">
          <label for="source">Source</label>
          <select id="source" class="native-select"></select>
          <button id="sourceButton" class="language-trigger" type="button" title="Select the source language." data-title-key="tipSource">Loading...</button>
          <div id="sourceMenu" class="language-menu"></div>
        </div>
        <div class="language-field" data-picker="target">
          <label for="target">Target</label>
          <select id="target" class="native-select"></select>
          <button id="targetButton" class="language-trigger" type="button" title="Select the target language." data-title-key="tipTarget">Loading...</button>
          <div id="targetMenu" class="language-menu"></div>
        </div>
      </div>
      <p id="modelQualityHint" class="subtle"></p>

      <div id="easterEggPanel" class="hidden">
        <div id="memoryGrid" class="memory-grid"></div>
        <div class="memory-status">
          <span id="memoryCounter" class="subtle"></span>
          <span id="memoryLastPair" class="subtle"></span>
          <span id="memoryWinText" class="subtle hidden"></span>
          <button id="memoryReset" class="secondary" type="button"></button>
        </div>
      </div>

      <div id="textareaPanel" class="tab-panel active">
        <label for="text">Text Field</label>
        <textarea id="text" title="Enter text or load it from a file." data-title-key="tipTextarea">The default translation quality should be better.</textarea>
        <div id="counter" class="counter" title="Characters used, character limit, and estimated translation chunks." data-title-key="tipCounter">0 / 0</div>
        <label for="textResult">Result</label>
        <textarea id="textResult" readonly title="The translation, once the job completes." data-title-key="tipTextResult"></textarea>
      </div>
    </section>

    <section id="filePanel" class="section tab-panel workspace-section">
      <label id="textFileLabel" for="textFile">TXT File</label>
      <input id="textFile" type="file" accept=".txt,text/plain" title="Select the file to load." data-title-key="tipFilePick">
      <label for="sheetName" class="file-extra xlsx-only">XLSX Sheet</label>
      <input id="sheetName" class="file-extra xlsx-only" type="text" placeholder="Optional, first sheet if empty" title="Which sheet to use in an XLSX file. Leave empty for the first sheet. Not used for CSV files, and not used if the columns field below lists its own sheets." data-title-key="tipSheetName">
      <label for="csvColumns" class="file-extra">Columns to translate</label>
      <textarea id="csvColumns" class="file-extra" rows="1" placeholder="Optional, e.g. title,description or A,B" title="Column names or letters to translate. Leave empty to translate every cell (numbers, IP and MAC addresses are skipped automatically). For several XLSX sheets at once, one &quot;Sheet: columns&quot; line per sheet, overriding the sheet field above." data-title-key="tipCsvColumns"></textarea>
      <label for="docPageRange" class="file-extra docx-only">Pages</label>
      <input id="docPageRange" class="file-extra docx-only" type="text" placeholder="Optional, e.g. 1-3,5" title="Optional page range, e.g. 1-3,5. Only counts manual page breaks (Ctrl+Enter); a document without any has one page. Leave empty to translate all pages." data-title-key="tipDocPageRange">
    </section>

    <section id="pdfPanel" class="section tab-panel workspace-section">
      <label for="pdf">PDF</label>
      <input id="pdf" type="file" accept="application/pdf" title="Select the PDF to translate." data-title-key="tipPdfPick">
      <label for="pageRange">Pages</label>
      <input id="pageRange" type="text" placeholder="Optional, e.g. 1-3,5" title="Optional page range, e.g. 1-3,5. Leave empty to translate all pages." data-title-key="tipPageRange">
    </section>

    <div id="primaryActions" class="actions primary-actions">
      <button id="translate" title="Start a new translation for the current input." data-title-key="tipTranslate">Translate</button>
    </div>

    <section id="jobsPanel" class="section workspace-section">
      <div class="section-heading">
        <button id="jobsCollapse" class="history-toggle" type="button" title="Show or hide the history list." data-title-key="tipHistoryToggle">
          <label for="history">History</label>
          <span id="jobsCollapseIcon" class="history-toggle-icon">&#9660;</span>
        </button>
        <div class="actions actions-right">
          <button id="pauseJob" class="secondary" disabled title="Pause the entire queue." data-title-key="tipPause">Pause</button>
          <button id="resumeJob" class="secondary" disabled title="Resume the entire queue." data-title-key="tipResume">Resume</button>
          <button id="stopJob" class="secondary" disabled title="Cancel the entire queue." data-title-key="tipStop">Stop</button>
          <div class="reset-history">
            <label id="historySelectAllLabel" class="history-select-all invisible">
              <input id="historySelectAll" type="checkbox">
              <span data-title-key="historySelectAll">Select all</span>
            </label>
            <button id="resetHistory" class="secondary" type="button" title="Select history entries to delete." data-title-key="tipHistoryReset">Select</button>
          </div>
        </div>
      </div>
      <div id="jobsBody">
        <input id="historyFilter" type="text" placeholder="Filter history..." title="Filter history by filename or languages." data-title-key="tipHistoryFilter">
        <div class="jobs-list">
          <div id="queue" class="queue"></div>
          <div id="history" class="history"></div>
        </div>
        <div id="historyPagination" class="actions history-pagination invisible">
          <button id="historyPrevPage" class="secondary" type="button" title="Previous page." data-title-key="tipPrevPage">&#8249;</button>
          <span id="historyPageInfo" class="section-meta"></span>
          <button id="historyNextPage" class="secondary" type="button" title="Next page." data-title-key="tipNextPage">&#8250;</button>
        </div>
      </div>
    </section>

    <footer>
      <a href="https://gitlab.com/uncoded-bytes/Linguinator" target="_blank" rel="noopener" title="Open the Linguinator repository." data-title-key="tipRepo">Linguinator</a><span id="appVersion"></span> - AGPL-3.0-or-later - by <a href="https://uncodedbytes.com" target="_blank" rel="noopener" title="Uncoded Bytes">Uncoded Bytes</a>
    </footer>
  </main>
  <script src="static/app.js"></script>
</body>
</html>
