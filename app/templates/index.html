<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lingumachina</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Lingumachina</h1>
        <p class="subtle">Lokale Uebersetzungsmaschine fuer Text- und Dokument-Workflows.</p>
      </div>
      <button id="historyToggle" class="secondary" type="button" title="Zur History-Ansicht wechseln.">History</button>
    </header>

    <div id="progress" class="progress workspace-section"></div>

    <section class="grid workspace-section">
      <div class="row">
        <div class="language-field" data-picker="source">
          <label for="source">Source</label>
          <select id="source" class="native-select"></select>
          <button id="sourceButton" class="language-trigger" type="button" title="Sprache des Eingabetextes auswaehlen.">Loading...</button>
          <div id="sourceMenu" class="language-menu"></div>
        </div>
        <div class="language-field" data-picker="target">
          <label for="target">Target</label>
          <select id="target" class="native-select"></select>
          <button id="targetButton" class="language-trigger" type="button" title="Sprache fuer die Uebersetzung auswaehlen.">Loading...</button>
          <div id="targetMenu" class="language-menu"></div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Input type">
        <button class="tab active" type="button" data-input-tab="textarea" title="Text direkt in das Eingabefeld schreiben.">Textfeld</button>
        <button class="tab" type="button" data-input-tab="text" title="TXT-Datei laden und uebersetzen.">Text</button>
        <button class="tab" type="button" data-input-tab="markdown" title="Markdown-Datei laden und uebersetzen.">Markdown</button>
        <button class="tab" type="button" data-input-tab="office" title="DOCX-, ODT- oder PPTX-Datei laden und als Text uebersetzen.">Office Doc</button>
        <button class="tab" type="button" data-input-tab="csv" title="CSV- oder XLSX-Datei laden und ausgewaehlte Spalten uebersetzen.">CSV File</button>
        <button class="tab" type="button" data-input-tab="pdf" title="PDF-Datei seitenweise extrahieren und uebersetzen.">PDF</button>
      </div>

      <div id="textareaPanel" class="tab-panel active">
        <label for="text">Textfeld</label>
        <textarea id="text" title="Text eingeben oder aus einer geladenen Datei uebernehmen.">The default translation quality should be better.</textarea>
        <div id="counter" class="counter">0 / 0</div>
      </div>
    </section>

    <section id="filePanel" class="section tab-panel workspace-section">
      <label id="textFileLabel" for="textFile">Text File</label>
      <input id="textFile" type="file" accept=".txt,text/plain" title="Datei auswaehlen, deren Text geladen werden soll.">
      <input id="sheetName" class="file-extra" type="text" placeholder="XLSX sheet name, optional" title="Optionaler XLSX-Blattname. Leer lassen nutzt das erste Blatt.">
      <input id="csvColumns" class="file-extra" type="text" placeholder="CSV/XLSX columns, e.g. title,description or A,B" title="Spaltennamen oder Spaltenbuchstaben angeben, die uebersetzt werden sollen.">
      <div class="actions">
        <button id="loadTextFile" class="secondary" type="button" title="Dateiinhalt in das Textfeld laden.">Load File</button>
      </div>
    </section>

    <section id="pdfPanel" class="section tab-panel workspace-section">
      <label for="pdf">PDF</label>
      <input id="pdf" type="file" accept="application/pdf" title="PDF-Datei auswaehlen, die uebersetzt werden soll.">
      <input id="pageRange" type="text" placeholder="Pages, e.g. 1-3,5" title="Optionaler Seitenbereich, z. B. 1-3,5. Leer lassen uebersetzt alle Seiten.">
      <div class="check-row" title="OCR ist Server-Konfiguration und hilft bei gescannten PDFs ohne echten Text.">
        <input id="useOcr" type="checkbox" disabled>
        <label id="ocrLabel" for="useOcr">OCR disabled</label>
      </div>
      <div class="check-row" title="Original-PDF als Hintergrund behalten und die Uebersetzung darueberlegen.">
        <input id="usePdfOverlay" type="checkbox">
        <label for="usePdfOverlay">Overlay PDF</label>
      </div>
      <div class="check-row" title="Im Overlay-Modus alte Textbereiche mit hellen Flaechen abdecken.">
        <input id="coverPdfText" type="checkbox">
        <label for="coverPdfText">Alten Text hell ueberdecken</label>
      </div>
    </section>

    <div class="actions workspace-section">
      <button id="translate" title="Neue Uebersetzung fuer die aktuelle Eingabe starten.">Eingabe uebersetzen</button>
      <button id="pauseJob" class="secondary" disabled title="Laufenden Job pausieren.">Pause</button>
      <button id="resumeJob" class="secondary" disabled title="Pausierten Job fortsetzen.">Fortsetzen</button>
      <button id="stopJob" class="secondary" disabled title="Laufenden Job abbrechen.">Stop</button>
    </div>

    <section class="section workspace-section">
      <div class="section-heading">
        <label for="result">Vorschau</label>
      </div>
      <pre id="result"></pre>
      <div id="previewNotice" class="preview-notice"></div>
      <div class="download-row">
        <label for="outputFormat">Downloadformat</label>
        <div class="actions export-actions">
          <select id="outputFormat" aria-label="Output format" title="Format fuer den Download auswaehlen.">
            <option value="txt">TXT</option>
            <option value="md">Markdown</option>
            <option value="pdf">PDF</option>
            <option value="original">Originalformat</option>
          </select>
          <button id="downloadResult" class="secondary" type="button" disabled title="Aktuelles Ergebnis im gewaehlten Format herunterladen.">Download</button>
        </div>
      </div>
    </section>

    <section id="historySection" class="section hidden">
      <h2>History</h2>
      <div id="history" class="history"></div>
    </section>

    <footer>
      Lingumachina - AGPL-3.0-or-later - von Marschux
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
