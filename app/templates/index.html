<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lingumachina</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <h1><img class="brand-logo" src="static/favicon.svg" alt="">Lingumachina</h1>
        <p class="subtle">Local translation workbench for text and document workflows.</p>
      </div>
      <div class="header-controls">
        <label for="uiLanguage">UI Language</label>
        <select id="uiLanguage" title="Select the interface language.">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </div>
    </header>

    <div id="progress" class="progress workspace-section"></div>

    <section id="queuePanel" class="section workspace-section">
      <div class="section-heading">
        <label for="queue">Queue</label>
        <span id="queueWorkers" class="section-meta"></span>
      </div>
      <div id="queue" class="queue"></div>
    </section>

    <section class="grid workspace-section">
      <div class="row">
        <div class="language-field" data-picker="source">
          <label for="source">Source</label>
          <select id="source" class="native-select"></select>
          <button id="sourceButton" class="language-trigger" type="button" title="Select the source language.">Loading...</button>
          <div id="sourceMenu" class="language-menu"></div>
        </div>
        <div class="language-field" data-picker="target">
          <label for="target">Target</label>
          <select id="target" class="native-select"></select>
          <button id="targetButton" class="language-trigger" type="button" title="Select the target language.">Loading...</button>
          <div id="targetMenu" class="language-menu"></div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Input type">
        <button class="tab active" type="button" data-input-tab="textarea" title="Type text directly into the input field.">Text Field</button>
        <button class="tab" type="button" data-input-tab="text" title="Load and translate a text-like file.">Text</button>
        <button class="tab" type="button" data-input-tab="markdown" title="Load and translate a Markdown file.">Markdown</button>
        <button class="tab" type="button" data-input-tab="office" title="Load and translate a DOCX, ODT, or PPTX file as text.">Office Doc</button>
        <button class="tab" type="button" data-input-tab="csv" title="Load and translate selected CSV or XLSX columns.">CSV File</button>
        <button class="tab" type="button" data-input-tab="pdf" title="Extract and translate a PDF page by page.">PDF</button>
      </div>
      <select id="inputTabSelect" class="input-tab-select" aria-label="Input type" title="Select the input type.">
        <option value="textarea">Text Field</option>
        <option value="text">Text</option>
        <option value="markdown">Markdown</option>
        <option value="office">Office Doc</option>
        <option value="csv">CSV File</option>
        <option value="pdf">PDF</option>
      </select>

      <div id="textareaPanel" class="tab-panel active">
        <label for="text">Text Field</label>
        <textarea id="text" title="Enter text or load it from a file.">The default translation quality should be better.</textarea>
        <div id="counter" class="counter" title="Characters used, character limit, and estimated translation chunks.">0 / 0</div>
      </div>
    </section>

    <section id="filePanel" class="section tab-panel workspace-section">
      <label id="textFileLabel" for="textFile">Text File</label>
      <input id="textFile" type="file" accept=".txt,text/plain" title="Select the file to load.">
      <input id="sheetName" class="file-extra" type="text" placeholder="XLSX sheet name, optional" title="Optional XLSX sheet name. Leave empty to use the first sheet.">
      <input id="csvColumns" class="file-extra" type="text" placeholder="CSV/XLSX columns, e.g. title,description or A,B" title="Column names or letters to translate.">
      <div class="actions">
        <button id="loadTextFile" class="secondary" type="button" title="Load file content into the text field.">Load File</button>
      </div>
    </section>

    <section id="pdfPanel" class="section tab-panel workspace-section">
      <label for="pdf">PDF</label>
      <input id="pdf" type="file" accept="application/pdf" title="Select the PDF to translate.">
      <input id="pageRange" type="text" placeholder="Pages, e.g. 1-3,5" title="Optional page range, e.g. 1-3,5. Leave empty to translate all pages.">
      <div class="check-row" title="OCR is a server setting and helps with scanned PDFs without embedded text.">
        <input id="useOcr" type="checkbox" disabled>
        <label id="ocrLabel" for="useOcr">OCR disabled</label>
      </div>
      <div class="check-row" title="Keep the original PDF as background and place translated text on top.">
        <input id="usePdfOverlay" type="checkbox">
        <label for="usePdfOverlay">Overlay PDF</label>
      </div>
      <div class="check-row" title="In overlay mode, cover old text areas with light rectangles.">
        <input id="coverPdfText" type="checkbox">
        <label for="coverPdfText">Cover old text</label>
      </div>
    </section>

    <div class="actions workspace-section">
      <button id="translate" title="Start a new translation for the current input.">Translate Input</button>
      <button id="clearInput" class="secondary" type="button" title="Clear the current input and preview.">Clear</button>
      <button id="pauseJob" class="secondary" disabled title="Pause the running job.">Pause</button>
      <button id="resumeJob" class="secondary" disabled title="Resume the paused job.">Resume</button>
      <button id="stopJob" class="secondary" disabled title="Cancel the running job.">Stop</button>
    </div>

    <section class="section workspace-section">
      <div class="section-heading">
        <label for="result">Preview</label>
      </div>
      <div id="previewPanel">
        <pre id="result"></pre>
        <div id="previewNotice" class="preview-notice"></div>
        <div class="download-row">
          <label for="outputFormat">Download Format</label>
          <div class="actions export-actions">
            <select id="outputFormat" aria-label="Output format" title="Select the download format.">
              <option value="txt">TXT</option>
              <option value="md">Markdown</option>
              <option value="pdf">PDF</option>
              <option value="original">Original Format</option>
            </select>
            <button id="downloadResult" class="secondary" type="button" disabled title="Download the current result in the selected format.">Download</button>
          </div>
        </div>
      </div>
    </section>

    <section id="historyPanel" class="section workspace-section">
      <div class="section-heading">
        <label for="history">History</label>
      </div>
      <div id="history" class="history"></div>
    </section>

    <footer>
      Lingumachina - AGPL-3.0-or-later - by Marschux
    </footer>
  </main>
  <script src="static/app.js"></script>
</body>
</html>
