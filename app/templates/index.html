<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linguinator</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <h1><a href="." class="brand-link" title="Reload Linguinator."><img class="brand-logo" src="static/favicon.svg" alt="">Linguinator</a></h1>
        <p class="subtle">Local translation workbench for text and document workflows.</p>
      </div>
      <div class="header-right">
        <div class="header-controls">
          <label for="uiLanguage" class="visually-hidden">UI Language</label>
          <select id="uiLanguage" title="Select the interface language.">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" title="Toggle light/dark mode." aria-label="Toggle light/dark mode." aria-pressed="false">
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5a8.5 8.5 0 1 1-9-13 7 7 0 0 0 9 13z"></path></svg>
        </button>
      </div>
    </header>

    <section class="grid workspace-section">
      <div class="tabs" role="tablist" aria-label="Input type">
        <button class="tab" type="button" data-input-tab="textarea" disabled title="Type text directly into the input field."><span class="tab-label">Text Field</span></button>
        <button class="tab" type="button" data-input-tab="text" disabled title="Load and translate a text-like file."><span class="tab-label">Text</span></button>
        <button class="tab" type="button" data-input-tab="markdown" disabled title="Load and translate a Markdown file."><span class="tab-label">Markdown</span></button>
        <button class="tab" type="button" data-input-tab="office" disabled title="Load and translate a DOCX or ODT file as text."><span class="tab-label">DOC File</span></button>
        <button class="tab" type="button" data-input-tab="pptx" disabled title="Load and translate a PowerPoint (PPTX) file as text."><span class="tab-label">PowerPoint</span></button>
        <button class="tab" type="button" data-input-tab="csv" disabled title="Load and translate selected CSV or XLSX columns."><span class="tab-label">CSV File</span></button>
        <button class="tab active" type="button" data-input-tab="pdf" title="Extract and translate a PDF page by page."><span class="tab-label">PDF</span></button>
      </div>
      <select id="inputTabSelect" class="input-tab-select" aria-label="Input type" title="Select the input type.">
        <option value="textarea" disabled>Text Field</option>
        <option value="text" disabled>Text</option>
        <option value="markdown" disabled>Markdown</option>
        <option value="office" disabled>DOC File</option>
        <option value="pptx" disabled>PowerPoint</option>
        <option value="csv" disabled>CSV File</option>
        <option value="pdf">PDF</option>
      </select>

      <div class="row">
        <div class="language-field" data-picker="source">
          <label for="source">Source</label>
          <select id="source" class="native-select"></select>
          <button id="sourceButton" class="language-trigger" type="button" title="Select the source language.">Loading...</button>
          <div id="sourceMenu" class="language-menu"></div>
        </div>
        <div class="language-field" data-picker="target">
          <label for="target">Target</label>
          <select id="target" class="native-select"></select>
          <button id="targetButton" class="language-trigger" type="button" title="Select the target language.">Loading...</button>
          <div id="targetMenu" class="language-menu"></div>
        </div>
      </div>
      <p id="modelQualityHint" class="subtle"></p>

      <div id="textareaPanel" class="tab-panel active">
        <label for="text">Text Field</label>
        <textarea id="text" title="Enter text or load it from a file.">The default translation quality should be better.</textarea>
        <div id="counter" class="counter" title="Characters used, character limit, and estimated translation chunks.">0 / 0</div>
      </div>
    </section>

    <section id="filePanel" class="section tab-panel workspace-section">
      <label id="textFileLabel" for="textFile">Text File</label>
      <input id="textFile" type="file" accept=".txt,text/plain" title="Select the file to load.">
      <input id="sheetName" class="file-extra" type="text" placeholder="XLSX sheet name, optional" title="Optional XLSX sheet name. Leave empty to use the first sheet.">
      <input id="csvColumns" class="file-extra" type="text" placeholder="CSV/XLSX columns, e.g. title,description or A,B" title="Column names or letters to translate.">
      <div class="actions">
        <button id="loadTextFile" class="secondary" type="button" title="Load file content into the text field.">Load File</button>
      </div>
    </section>

    <section id="pdfPanel" class="section tab-panel workspace-section">
      <label for="pdf">PDF</label>
      <input id="pdf" type="file" accept="application/pdf" title="Select the PDF to translate.">
      <input id="pageRange" type="text" placeholder="Pages, e.g. 1-3,5" title="Optional page range, e.g. 1-3,5. Leave empty to translate all pages.">
    </section>

    <div id="progress" class="progress workspace-section"></div>
    <div id="ownJobBanner" class="own-job-banner hidden"></div>

    <div id="primaryActions" class="actions actions-right primary-actions">
      <button id="translate" title="Start a new translation for the current input.">Translate Input</button>
      <button id="clearInput" class="secondary" type="button" title="Clear the current input and result.">Clear</button>
    </div>

    <section id="queuePanel" class="section workspace-section">
      <div class="section-heading">
        <button id="queueCollapse" class="history-toggle" type="button" title="Show or hide the queue list.">
          <label for="queue">Queue</label>
          <span id="queueCollapseIcon" class="history-toggle-icon">&#9660;</span>
        </button>
      </div>
      <div id="queueBody">
        <div class="actions">
          <button id="pauseJob" class="secondary" disabled title="Pause the entire queue.">Pause</button>
          <button id="resumeJob" class="secondary" disabled title="Resume the entire queue.">Resume</button>
          <button id="stopJob" class="secondary" disabled title="Cancel the entire queue.">Stop</button>
        </div>
        <div id="queue" class="queue"></div>
      </div>
    </section>

    <section id="historyPanel" class="section workspace-section">
      <div class="section-heading">
        <button id="historyCollapse" class="history-toggle" type="button" title="Show or hide the history list.">
          <label for="history">History</label>
          <span id="historyCollapseIcon" class="history-toggle-icon">&#9660;</span>
        </button>
      </div>
      <div id="historyBody">
        <input id="historyFilter" type="text" placeholder="Filter history..." title="Filter history by filename or languages.">
        <div id="history" class="history"></div>
        <div id="historyPagination" class="actions history-pagination invisible">
          <button id="historyPrevPage" class="secondary" type="button" title="Previous page.">&#8249;</button>
          <span id="historyPageInfo" class="section-meta"></span>
          <button id="historyNextPage" class="secondary" type="button" title="Next page.">&#8250;</button>
        </div>
      </div>
    </section>

    <footer>
      <a href="https://gitlab.com/Marschux/Linguinator" target="_blank" rel="noopener" title="Open the Linguinator repository.">Linguinator</a><span id="appVersion"></span> - AGPL-3.0-or-later - by Marschux
    </footer>
  </main>
  <script src="static/app.js"></script>
</body>
</html>
