<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NLLB Translate</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>NLLB Translate</h1>
        <p class="subtle">Local translation UI for text and PDF workflows.</p>
      </div>
      <button id="historyToggle" class="secondary" type="button">History</button>
    </header>

    <div id="progress" class="progress"></div>

    <section class="grid">
      <div class="row">
        <div class="language-field" data-picker="source">
          <label for="source">Source</label>
          <select id="source" class="native-select"></select>
          <button id="sourceButton" class="language-trigger" type="button">Loading...</button>
          <div id="sourceMenu" class="language-menu"></div>
        </div>
        <div class="language-field" data-picker="target">
          <label for="target">Target</label>
          <select id="target" class="native-select"></select>
          <button id="targetButton" class="language-trigger" type="button">Loading...</button>
          <div id="targetMenu" class="language-menu"></div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Input type">
        <button class="tab active" type="button" data-input-tab="textarea">Textfeld</button>
        <button class="tab" type="button" data-input-tab="text">Text</button>
        <button class="tab" type="button" data-input-tab="markdown">Markdown</button>
        <button class="tab" type="button" data-input-tab="office">Office Doc</button>
        <button class="tab" type="button" data-input-tab="csv">CSV File</button>
        <button class="tab" type="button" data-input-tab="pdf">PDF</button>
      </div>

      <div id="textareaPanel" class="tab-panel active">
        <label for="text">Textfeld</label>
        <textarea id="text">The default translation quality should be better.</textarea>
        <div id="counter" class="counter">0 / 0</div>
      </div>
    </section>

    <section id="filePanel" class="section tab-panel">
      <label id="textFileLabel" for="textFile">Text File</label>
      <input id="textFile" type="file" accept=".txt,text/plain">
      <input id="sheetName" class="file-extra" type="text" placeholder="XLSX sheet name, optional">
      <input id="csvColumns" class="file-extra" type="text" placeholder="CSV/XLSX columns, e.g. title,description or A,B">
      <div class="actions">
        <button id="loadTextFile" class="secondary" type="button">Load File</button>
      </div>
    </section>

    <section id="pdfPanel" class="section tab-panel">
      <label for="pdf">PDF</label>
      <input id="pdf" type="file" accept="application/pdf">
      <input id="pageRange" type="text" placeholder="Pages, e.g. 1-3,5">
      <div class="check-row">
        <input id="useOcr" type="checkbox" disabled>
        <label id="ocrLabel" for="useOcr">OCR disabled</label>
      </div>
      <div class="check-row">
        <input id="usePdfOverlay" type="checkbox">
        <label for="usePdfOverlay">Overlay PDF</label>
      </div>
      <div class="check-row">
        <input id="coverPdfText" type="checkbox">
        <label for="coverPdfText">Alten Text hell ueberdecken</label>
      </div>
      <div class="actions">
        <button id="extractPdf" class="secondary">PDF to Markdown</button>
        <button id="translatePdf">Translate PDF to Markdown</button>
      </div>
    </section>

    <div class="actions">
      <button id="translate">Translate</button>
      <button id="pauseJob" class="secondary" disabled>Pause</button>
      <button id="resumeJob" class="secondary" disabled>Start</button>
      <button id="stopJob" class="secondary" disabled>Stop</button>
    </div>

    <section class="section">
      <div class="section-heading">
        <label for="result">Vorschau</label>
        <div class="actions export-actions">
          <select id="outputFormat" aria-label="Output format">
            <option value="txt">TXT</option>
            <option value="md">Markdown</option>
            <option value="pdf">PDF</option>
            <option value="original">Originalformat</option>
          </select>
          <button id="downloadResult" class="secondary" type="button" disabled>Download</button>
        </div>
      </div>
      <pre id="result"></pre>
      <div id="previewNotice" class="preview-notice"></div>
    </section>

    <section id="historySection" class="section hidden">
      <h2>History</h2>
      <div id="history" class="history"></div>
    </section>

    <footer>
      NLLB Translate UI - AGPL-3.0-or-later
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
